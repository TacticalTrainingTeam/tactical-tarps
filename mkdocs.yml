site_name: Tactical Tarps Documentation
site_description: Documentation for Tactical Tarps Mod for Arma 3
site_url: https://tacticaltrainingteam.github.io/tactical-tarps/

repo_url: https://github.com/TacticalTrainingTeam/tactical-tarps
repo_name: TacticalTrainingTeam/tactical-tarps
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  variant: classic
  language: en
  logo: assets/icon.png
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.path
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - privacy
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - abbr
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Common: common.md
  - Scripting & API: scripting.md
  - Drone: drone.md
  - Hazmat: hazmat.md
  - Medic: medic.md
  - Repair: repair.md
  - Shelter: shelter.md
  - Signal: signal.md
  - Contributing: contributing.md
  - License: license.md
